basePath: /api
definitions:
  auth.CreateUserDto:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - phone
    - username
    type: object
  auth.LoginDto:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      token:
        type: string
      username:
        type: string
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  bookings.BookingDto:
    properties:
      bookingDate:
        type: string
      employeeId:
        type: integer
      notes:
        maxLength: 250
        type: string
      serviceId:
        type: integer
    required:
    - bookingDate
    type: object
  common.ErrorResponse:
    properties:
      message:
        type: string
      statusCode:
        type: integer
    type: object
  model.AllBookingsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.BookingResponse'
        type: array
      metadata:
        $ref: '#/definitions/model.PaginationMetadata'
    type: object
  model.AllScheduleOverridesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.ScheduleOverrideResponse'
        type: array
      metadata:
        $ref: '#/definitions/model.PaginationMetadata'
    type: object
  model.AllSchedulesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.ScheduleResponse'
        type: array
      metadata:
        $ref: '#/definitions/model.PaginationMetadata'
    type: object
  model.AllServicesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.ServiceResponse'
        type: array
      metadata:
        $ref: '#/definitions/model.PaginationMetadata'
    type: object
  model.AllUsersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.UserResponse'
        type: array
      metadata:
        $ref: '#/definitions/model.PaginationMetadata'
    type: object
  model.BookingResponse:
    properties:
      bookingDate:
        type: string
      createdAt:
        type: string
      customer:
        $ref: '#/definitions/model.UserResponse'
      customerId:
        type: integer
      employee:
        $ref: '#/definitions/model.UserResponse'
      employeeId:
        type: integer
      id:
        type: integer
      notes:
        type: string
      service:
        $ref: '#/definitions/model.ServiceResponse'
      serviceId:
        type: integer
      status:
        type: string
      updatedAt:
        type: string
    type: object
  model.PaginationMetadata:
    properties:
      totalItems:
        type: integer
    type: object
  model.ScheduleOverrideResponse:
    properties:
      allDay:
        type: boolean
      createdAt:
        type: string
      date:
        type: string
      employee:
        $ref: '#/definitions/model.UserResponse'
      employeeId:
        type: integer
      endTime:
        type: string
      id:
        type: integer
      isAvailable:
        type: boolean
      reason:
        type: string
      startTime:
        type: string
      updatedAt:
        type: string
    type: object
  model.ScheduleResponse:
    properties:
      createdAt:
        type: string
      employee:
        $ref: '#/definitions/model.UserResponse'
      employeeId:
        type: integer
      endTime:
        type: string
      id:
        type: integer
      startTime:
        type: string
      updatedAt:
        type: string
      weekDay:
        type: integer
    type: object
  model.ServiceResponse:
    properties:
      createdAt:
        type: string
      durationMinutes:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      updatedAt:
        type: string
    type: object
  model.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    type: object
  schedule.CreateScheduleDto:
    properties:
      endTime:
        type: string
      startTime:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - endTime
    - startTime
    type: object
  scheduleexceptions.CreateScheduleExDto:
    properties:
      allDay:
        type: boolean
      date:
        type: string
      endTime:
        type: string
      reason:
        type: string
      startTime:
        type: string
    required:
    - reason
    type: object
  services.CreateServiceDto:
    properties:
      durationMinutes:
        maximum: 360
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      price:
        type: number
    required:
    - durationMinutes
    - name
    - price
    type: object
  services.UpdateServiceDto:
    properties:
      durationMinutes:
        maximum: 360
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      price:
        type: number
    type: object
  user.ConnectServicesToUserDto:
    properties:
      serviceIds:
        items:
          type: integer
        maxItems: 20
        minItems: 1
        type: array
    required:
    - serviceIds
    type: object
  user.UpdateUserDto:
    properties:
      email:
        type: string
      password:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
      username:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  user.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
